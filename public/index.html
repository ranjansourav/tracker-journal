<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tracker / Journal</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width:800px; margin:24px auto; padding:0 16px; }
      header { display:flex; align-items:center; justify-content:space-between; }
      form { margin-top:16px; display:grid; gap:8px; }
      textarea { width:100%; height:100px; }
      .entry { border:1px solid #ddd; padding:8px; margin-top:8px; border-radius:6px; }
      .meta { font-size:0.9rem; color:#666; }
      button { cursor:pointer; }
    </style>
  </head>
  <body>
    <header>
      <h1>Tracker / Journal</h1>
      <div id="status"></div>
    </header>

    <section>
      <form id="entryForm">
        <input id="title" placeholder="Title" />
        <input id="tags" placeholder="Tags (comma separated)" />
        <textarea id="content" placeholder="Write your note..."></textarea>
        <div><button type="submit">Add Entry</button></div>
      </form>
    </section>

    <section id="entries"></section>

    <script src="/app.js"></script>
  </body>
</html>
